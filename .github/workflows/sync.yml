name: Garmin to Notion Sync

on:
  schedule:
    # Times pegged to America/Denver MDT (UTC-6). In MST (winter) each run
    # shifts +1h local: 9 AM / 1 PM / 9 PM / 1 AM. GitHub cron is UTC-only.
    - cron: '0 14 * * *'  # 8 AM MDT
    - cron: '0 18 * * *'  # 12 PM MDT
    - cron: '0 2 * * *'   # 8 PM MDT (prev day UTC)
    - cron: '0 6 * * *'   # 12 AM MDT (prev day UTC)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # lets the keepalive step re-enable this workflow
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore Garmin tokens
        uses: actions/cache@v5
        id: garmin-tokens
        with:
          path: ~/.garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      # Restore/save are split so the (possibly rotated) Google refresh token
      # is saved even when a later sync step fails the job.
      - name: Restore Google Health tokens
        uses: actions/cache/restore@v5
        with:
          path: ~/.google_health_tokens
          key: google-health-tokens-${{ github.run_id }}
          restore-keys: |
            google-health-tokens-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GARMIN_TOKENSTORE: ~/.garmin_tokens
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          GARMIN_DAYS_BACK: ${{ vars.GARMIN_DAYS_BACK || '30' }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ vars.GARMIN_ACTIVITIES_FETCH_LIMIT || '1000' }}
          SYNC_SLEEP: ${{ vars.SYNC_SLEEP || 'true' }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
          GOOGLE_HEALTH_TOKENSTORE: ~/.google_health_tokens
          FITBIT_DAYS_BACK: ${{ vars.FITBIT_DAYS_BACK || '' }}
          PYTHONPATH: src
        run: python -m garmin_to_notion all

      - name: Save Google Health tokens
        if: always()  # warns (doesn't fail) when Fitbit isn't configured
        uses: actions/cache/save@v5
        with:
          path: ~/.google_health_tokens
          key: google-health-tokens-${{ github.run_id }}

      # GitHub disables scheduled workflows after 60 days without repo
      # activity. Re-enabling an active workflow resets that timer, so every
      # run keeps the schedule alive without a third-party action.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
