name: Push boot camp workouts to Garmin

# Manual only. Uploads (or updates) the circuits in
# src/garmin_to_notion/bootcamp.py to Garmin Connect > Training > Workouts.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Circuit number to push (blank = all)'
        required: false
        default: ''
      schedule:
        description: 'Also schedule on this date (YYYY-MM-DD, blank = no)'
        required: false
        default: ''

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Restore Garmin tokens
        uses: actions/cache@v5
        with:
          path: ~/.garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Push workouts
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_TOKENSTORE: ~/.garmin_tokens
          PYTHONPATH: src
          ONLY: ${{ inputs.only }}
          SCHEDULE: ${{ inputs.schedule }}
        run: |
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ -n "$SCHEDULE" ] && args+=(--schedule "$SCHEDULE")
          python scripts/push_workouts.py "${args[@]}"
