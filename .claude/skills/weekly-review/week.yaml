# Tanner's standard week. The weekly review schedules exactly this, every week.
# Rules behind it are in docs/fitness-context.md:
# each weekday is a 30-min cardio workout then the lift (two Garmin workouts), Sat zone 2, Sun rest,
# never make up a missed day.
#
# Each day lists Garmin workouts by exact name (or id), in order. Change a day
# here, not in the review, so the plan stays decision-free.

start_by: "05:15"        # a morning counts as on time if the first activity starts by this
alarm: "04:55"
timezone: America/Denver

days:
  mon:
    focus: Push A (chest)
    workouts: ["Treadmill Vest Walk 30", Upper Push 1]
  tue:
    focus: Pull A (rows)
    workouts: ["Echo Bike 30", Upper Pull 1]
  wed:
    focus: Push B (shoulders, triceps)
    workouts: ["Treadmill Vest Walk 30", Upper Push 2]
  thu:
    focus: Pull B (vertical pull)
    workouts: ["Row 30", Upper Pull 2]
  fri:
    focus: Lower body + core
    workouts: ["Treadmill Vest Walk 30", Full Body 1]
  sat:
    focus: Zone 2
    workouts: ["Zone 2: 45-60 min"]
  sun:
    focus: Rest
    workouts: []

# Mirror of the Garmin schedule on Google Calendar (weekly-review step 6).
# One event per training day that is on the Garmin calendar. A day with
# time: null is skipped until Tanner picks a time.
google_calendar:
  calendar_id: 9cf8668fc8c2fb506eb64baf7ae3e8feb702562d741bd9c1d058b4469b9d920b@group.calendar.google.com  # "Habits"
  weekday: {start: "05:15", end: "06:30", emoji: "💪"}
  sat: {start: null, end: null, emoji: "🚴"}   # Sat time not set yet (Nov 19 2026)
